server {
  listen 80;
  server_name _;

  # Serve static files
  root /usr/share/nginx/html;
  index index.html;

  # Gzip can interfere with SSE in some cases
  gzip off;

  # Proxy dynamic SEO endpoints to the API
  location = /rss.xml {
    proxy_pass http://api:4000/rss.xml;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }
  location = /sitemap.xml {
    proxy_pass http://api:4000/sitemap.xml;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }

  # SPA fallback for client-side routing
  location / {
    try_files $uri /index.html;
  }

  # Proxy API to the backend container
  location /api/ {
    proxy_pass http://api:4000/api/;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # Important for Server-Sent Events (live notifications)
    proxy_buffering off;
    add_header X-Accel-Buffering no;
    proxy_read_timeout 1h;
  }
}
