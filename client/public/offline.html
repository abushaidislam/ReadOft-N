<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Readoft</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background: #0b0d0f; color: #e5e7eb; display:flex; align-items:center; justify-content:center; min-height:100vh; }
      .card { max-width: 560px; margin: 16px; padding: 24px; border-radius: 12px; border:1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.04); }
      h1 { margin: 0 0 8px 0; font-size: 1.6rem; }
      p { margin: 0 0 12px 0; line-height: 1.6; color:#9ca3af; }
      .btn { display:inline-block; padding:10px 14px; border-radius:10px; background:#2563eb; color:white; text-decoration:none; border:1px solid rgba(255,255,255,.12); }
      .muted { font-size: .9rem; color:#9ca3af; margin-top: 8px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You are offline</h1>
      <p>The content you’re trying to view isn’t available offline yet.</p>
      <p>Check your internet connection and try again.</p>
      <a class="btn" href="/">Go to Home</a>
      <div class="muted">Tip: Open an article once to cache it for later offline reading.</div>
    </div>
  </body>
</html>
