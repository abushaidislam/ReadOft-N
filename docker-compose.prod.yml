services:
  api:
    build:
      context: ./server
      target: production
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      # Allow requests from the frontend origin served by Nginx
      CORS_ORIGIN: http://localhost:8080
      # Used by SEO endpoints and email links to build absolute URLs
      PUBLIC_BASE_URL: http://localhost:8080
    ports:
      - "4000:4000"
  web:
    build:
      context: ./client
      target: production
    env_file:
      - ./client/.env
    environment:
      NODE_ENV: production
    depends_on:
      - api
    ports:
      - "8080:80"
